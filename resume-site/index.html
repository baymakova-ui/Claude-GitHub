<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-key="meta.title">Баймакова Ксения — Резюме</title>
  <meta name="description" data-key-attr="meta.description|content" content="" />

  <!-- Open Graph / Social sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" data-key-attr="meta.title|content" content="" />
  <meta property="og:description" data-key-attr="meta.description|content" content="" />
  <meta property="og:image" content="assets/photo.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Favicon: KB monogram -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231a2744'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Georgia, serif' font-size='32' font-weight='600' fill='%23b8966e'%3EKB%3C/text%3E%3C/svg%3E" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Custom cursor -->
  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <!-- Top navigation -->
  <header class="nav" id="nav">
    <a href="#hero" class="nav__brand" aria-label="Ksenia Baimakova">
      <span class="nav__monogram">KB</span>
    </a>

    <nav class="nav__links" aria-label="Main">
      <a href="#about" data-key="nav.about"></a>
      <a href="#experience" data-key="nav.experience"></a>
      <a href="#education" data-key="nav.education"></a>
      <a href="#contact" data-key="nav.contact"></a>
    </nav>

    <div class="lang-switch" role="group" aria-label="Language">
      <button class="lang-switch__btn" data-lang="ru" aria-label="Русский">RU</button>
      <span class="lang-switch__sep">·</span>
      <button class="lang-switch__btn" data-lang="de" aria-label="Deutsch">DE</button>
      <span class="lang-switch__sep">·</span>
      <button class="lang-switch__btn" data-lang="en" aria-label="English">EN</button>
    </div>

    <button class="nav__burger" id="burger" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- Mobile menu -->
  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <a href="#about" data-key="nav.about"></a>
    <a href="#experience" data-key="nav.experience"></a>
    <a href="#education" data-key="nav.education"></a>
    <a href="#skills" data-key="nav.skills"></a>
    <a href="#achievements" data-key="nav.achievements"></a>
    <a href="#languages" data-key="nav.languages"></a>
    <a href="#contact" data-key="nav.contact"></a>
  </div>

  <main id="content">

    <!-- HERO -->
    <section class="hero" id="hero">
      <div class="hero__inner">
        <p class="hero__overline" data-key="hero.subtitle"></p>
        <h1 class="hero__name" data-key="hero.name"></h1>
        <p class="hero__title">
          <span class="typewriter" id="typewriter" data-key="hero.title"></span>
          <span class="typewriter__caret" aria-hidden="true">|</span>
        </p>
      </div>

      <a href="#about" class="hero__scroll" aria-label="Scroll">
        <span data-key="hero.scroll"></span>
        <svg width="14" height="22" viewBox="0 0 14 22" fill="none" aria-hidden="true">
          <path d="M7 1v20M1 15l6 6 6-6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <div class="hero__corner hero__corner--tl"></div>
      <div class="hero__corner hero__corner--br"></div>
    </section>

    <!-- ABOUT -->
    <section class="about section" id="about">
      <div class="section__label" data-key="about.label"></div>
      <div class="about__grid">
        <div class="about__text reveal">
          <h2 class="section__heading" data-key="about.heading"></h2>
          <p class="about__body" data-key="about.text"></p>
        </div>
        <figure class="about__photo reveal">
          <div class="about__photo-frame">
            <img src="assets/photo.jpg" alt="Ksenia Baimakova" loading="lazy" onerror="if(this.src.indexOf('photo.svg')===-1){this.src='assets/photo.svg';}" />
          </div>
          <figcaption data-key="about.photoCaption"></figcaption>
        </figure>
      </div>
    </section>

    <!-- SKILLS TICKER -->
    <section class="skills section" id="skills">
      <div class="section__label" data-key="skills.label"></div>
      <h2 class="section__heading section__heading--center" data-key="skills.heading"></h2>
      <div class="ticker" aria-hidden="false">
        <div class="ticker__track" id="skillTicker"></div>
      </div>
    </section>

    <!-- EXPERIENCE -->
    <section class="experience section" id="experience">
      <div class="section__label" data-key="experience.label"></div>
      <h2 class="section__heading section__heading--center" data-key="experience.heading"></h2>
      <div class="timeline" id="timeline"></div>
    </section>

    <!-- EDUCATION -->
    <section class="education section" id="education">
      <div class="section__label" data-key="education.label"></div>
      <h2 class="section__heading section__heading--center" data-key="education.heading"></h2>
      <div class="education__grid" id="educationGrid"></div>
      <div class="education__certs reveal">
        <h3 class="education__certs-label" data-key="education.certificationsLabel"></h3>
        <ul class="education__certs-list" id="certsList"></ul>
      </div>
    </section>

    <!-- ACHIEVEMENTS -->
    <section class="achievements section" id="achievements">
      <div class="section__label" data-key="achievements.label"></div>
      <h2 class="section__heading section__heading--center" data-key="achievements.heading"></h2>
      <div class="achievements__grid" id="achievementsGrid"></div>
      <div class="achievements__special reveal">
        <h3 class="achievements__special-label" data-key="achievements.specialLabel"></h3>
        <ul class="achievements__special-list" id="specialList"></ul>
      </div>
    </section>

    <!-- LANGUAGES -->
    <section class="languages section" id="languages">
      <div class="section__label" data-key="languages.label"></div>
      <h2 class="section__heading section__heading--center" data-key="languages.heading"></h2>
      <div class="languages__list" id="languagesList"></div>
    </section>

    <!-- CONTACT -->
    <section class="contact section" id="contact">
      <div class="section__label" data-key="contact.label"></div>
      <h2 class="section__heading section__heading--center" data-key="contact.heading"></h2>
      <p class="contact__intro reveal" data-key="contact.intro"></p>
      <div class="contact__details reveal">
        <div class="contact__row">
          <span class="contact__row-label" data-key="contact.emailLabel"></span>
          <a class="contact__row-value" id="contactEmail" href="#"></a>
        </div>
        <div class="contact__row">
          <span class="contact__row-label" data-key="contact.phoneLabel"></span>
          <a class="contact__row-value" id="contactPhone" href="#"></a>
        </div>
      </div>
      <a class="contact__cta reveal" id="contactCta" href="#">
        <span data-key="contact.cta"></span>
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none" aria-hidden="true">
          <path d="M1 7h15M11 1l5 6-5 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </section>

    <footer class="footer">
      <div class="footer__line">
        <span class="footer__brand">Ksenia Baimakova</span>
        <span class="footer__year" id="footerYear"></span>
        <span class="footer__rights" data-key="footer.rights"></span>
      </div>
    </footer>
  </main>

  <!-- Floating download button -->
  <div class="download" id="download">
    <button class="download__btn" id="downloadBtn" aria-haspopup="true" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8 1v10M3 7l5 5 5-5M2 15h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span data-key="download.label"></span>
    </button>
    <div class="download__menu" id="downloadMenu" hidden>
      <a href="assets/resume-ru.pdf" download data-key="download.ru"></a>
      <a href="assets/resume-de.pdf" download data-key="download.de"></a>
      <a href="assets/resume-en.pdf" download data-key="download.en"></a>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
